name: Pacchetto Release Windows

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.13'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.14'
      - name: Verifica tag stabile e versione
        run: >-
          python -c "import os,re; from src import __version__; tag=os.environ['GITHUB_REF_NAME'];
          assert re.fullmatch(r'v\d+\.\d+\.\d+',tag) and tag=='v'+__version__, 'Eseguire il workflow su un tag stabile allineato al codice'"
      - run: uv sync --locked
      - run: uv run --no-sync python -m pytest -q
        env:
          STRUMENTI_UPDATE_E2E: '1'
      - run: uv run --no-sync python build_release.py
      - name: Pubblica Release stabile dopo il superamento dei test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag dist/release/* --verify-tag --title "Strumenti LYSA $tag" --notes-file RELEASE_NOTES.md --latest
