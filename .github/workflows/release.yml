name: Pacchetto Release Windows

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag stabile da verificare e pubblicare (es. v2.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
      UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/strumenti-python
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.14'
      - name: Installa lo stesso runtime Python dei pacchetti distribuiti
        run: uv python install 3.12.13 --no-bin --no-registry
      - run: uv sync --locked --python 3.12.13 --managed-python
      - name: Verifica tag stabile e versione
        run: >-
          uv run --no-sync python -c "import os,re; from src import __version__; tag=os.environ['RELEASE_TAG'];
          assert re.fullmatch(r'v\d+\.\d+\.\d+',tag) and tag=='v'+__version__, 'Eseguire il workflow su un tag stabile allineato al codice'"
      - run: uv run --no-sync python -m pytest -q
        env:
          STRUMENTI_UPDATE_E2E: '1'
      - run: uv run --no-sync python build_release.py
      - name: Pubblica Release stabile dopo il superamento dei test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          gh release create $tag dist/release/* --verify-tag --title "Strumenti LYSA $tag" --notes-file RELEASE_NOTES.md --latest
